name: CFG safety tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cfg-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run CFG parser and export tests
        run: node --test tests/*.test.mjs
